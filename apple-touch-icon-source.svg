    <path d="M192 672 C272 552 352 552 432 632 C512 552 592 552 672 672" opacity="0.55"/>
    <path d="M272 512 C352 392 432 392 512 472 C592 392 672 392 752 512" opacity="0.8"/>
    <path d="M352 352 C432 232 512 232 592 312 C672 232 752 232 832 352"/>
  </g>
</svg>
