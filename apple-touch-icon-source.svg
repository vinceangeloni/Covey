<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2725b"/>
      <stop offset="1" stop-color="#c8553d"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed, opaque, unrounded square: iOS applies its own corner mask and shine. -->
